<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - College Marketplace</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header>
      <div class="header-logo">OLX CGEC</div>
    </header>
    <div class="container">
      <div class="auth-form">
        <h2>Create Account</h2>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="Enter your email" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            placeholder="Enter your password"
          />
        </div>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input id="name" type="text" placeholder="Enter your full name" />
        </div>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input id="phone" type="text" placeholder="Enter your phone number" />
        </div>
        <div class="form-group">
          <label for="upi">UPI ID</label>
          <input id="upi" type="text" placeholder="Enter your UPI ID" />
        </div>
        <div id="msg" class="message"></div>
        <div class="button-group">
          <button id="registerBtn">Register</button>
          <button id="toLogin" class="secondary">Back to Login</button>
        </div>
      </div>
    </div>

    <script>
      const apiBase = "";

      document.getElementById("toLogin").addEventListener("click", () => {
        location.href = "/static/login.html";
      });

      document
        .getElementById("registerBtn")
        .addEventListener("click", async () => {
          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;
          const name = document.getElementById("name").value;
          const phone = document.getElementById("phone").value;
          const upi_id = document.getElementById("upi").value;

          const res = await fetch(apiBase + "/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password, name, phone, upi_id }),
          });

          if (!res.ok) {
            const j = await res
              .json()
              .catch(() => ({ detail: res.statusText }));
            document.getElementById("msg").innerText =
              "Register failed: " + (j.detail || res.statusText);
            return;
          }
          // auto login after register (optional): store token not returned by register normally.
          document.getElementById("msg").innerText =
            "Registered. Please login.";
        });
    </script>
  </body>
</html>

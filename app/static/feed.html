<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketplace - Feed</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header>
      <div class="header-logo">OLX CGEC</div>
      <nav class="header-nav">
        <button class="nav-btn" id="profileBtn">Profile</button>
        <button class="nav-btn" id="myPostsBtn">My Items</button>
        <button class="nav-btn" id="sellBtn">Sell</button>
        <button class="nav-btn" id="logoutBtn">Logout</button>
      </nav>
    </header>

    <div class="container">
      <h1>Featured Items</h1>
      <div id="posts" class="posts-container"></div>
    </div>

    <script>
      const apiBase = "";

      function authHeaders() {
        const t = localStorage.getItem("token");
        return t ? { Authorization: "Bearer " + t } : {};
      }

      document.getElementById("logoutBtn").onclick = () => {
        localStorage.removeItem("token");
        location.href = "/static/login.html";
      };
      document.getElementById("sellBtn").onclick = () =>
        (location.href = "/static/upload.html");
      document.getElementById("myPostsBtn").onclick = () =>
        (location.href = "/static/my_posts.html");
      document.getElementById("profileBtn").onclick = () =>
        (location.href = "/static/profile.html");

      async function loadFeed() {
        // ---- 1. GET CURRENT USER ----
        const meRes = await fetch("/auth/me", { headers: authHeaders() });
        if (!meRes.ok) {
          alert("Not authenticated. Please login.");
          location.href = "/static/login.html";
          return;
        }
        const me = await meRes.json();
        const myId = me.id;

        // ---- 2. LOAD POSTS ----
        const res = await fetch(apiBase + "/feed", {
          headers: authHeaders(),
        });

        if (!res.ok) {
          alert("Unable to load feed");
          return;
        }

        const posts = await res.json();
        const container = document.getElementById("posts");
        container.innerHTML = "";

        // ---- 3. RENDER FEED POSTS ----
        posts.forEach((p) => {
          // Hide my own posts:
          if (p.user_id === myId) return;

          const sellerName = p.user?.name || p.user?.email || "Unknown";
          const sellernum = p.user?.phone || "Unknown";

          const div = document.createElement("div");
          div.className = "post";

          div.innerHTML = `
        ${p.url ? `<img src="${p.url}" class="post-image" alt="${p.title || "Product"}">` : `<div class="post-image"></div>`}
        <div class="post-body">
          <h3 class="post-title">${p.title || "Untitled"}</h3>
          <div class="seller-info">
            <strong>Seller:</strong> ${sellerName}<br>
            <strong>Phone:</strong> ${sellernum}
          </div>
          <p class="post-description">${p.description || ""}</p>
          <div class="post-meta">
            <div><strong>Price:</strong> <span class="price">₹${p.price ?? "N/A"}</span></div>
            <div><strong>Location:</strong> ${p.location ?? "N/A"}</div>
            <div><strong>Posted:</strong> ${p.created_at ?? "N/A"}</div>
          </div>
        </div>
        <div class="post-actions">
          <button id="btn-${p.id}" class="buy-btn">Buy</button>
        </div>
      `;

          // BUY BUTTON
          const buyBtn = div.querySelector(".buy-btn");
          buyBtn.onclick = () => buyPost(p.id);

          container.appendChild(div);
        });
      }

      //   setTimeout(() => {
      //     if (confirm("After completing payment, click OK to confirm.")) {
      //       confirmPayment(postId);
      //     }
      //   }, 1500);
      // }

      // **********************************************************************************************************

      async function buyPost(postId) {
        const res = await fetch("/create_order/" + postId, {
          headers: authHeaders(),
        });

        const data = await res.json();

        const url = `/static/payment.html?order_id=${data.order_id}&amount=${data.amount}&key=${data.key}&post_id=${postId}&title=${encodeURIComponent(data.title)}`;

        window.location.href = url;
      }

      // **********************************************************************************************************

      async function confirmPayment(postId) {
        const res = await fetch(apiBase + "/confirm_payment/" + postId, {
          method: "POST",
          headers: authHeaders(),
        });
        if (!res.ok) return alert("Payment confirmation failed");
        alert("Payment confirmed!");
        loadFeed();
      }

      loadFeed();
    </script>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Items - College Marketplace</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header>
      <div class="header-logo">OLX CGEC</div>
      <nav class="header-nav">
        <button class="nav-btn" onclick="location.href = '/static/feed.html'">
          Back to Feed
        </button>
      </nav>
    </header>

    <div class="container">
      <h1>My Items</h1>
      <div id="mine" class="posts-container"></div>
    </div>

    <script>
      const apiBase = "";
      function authHeaders() {
        const t = localStorage.getItem("token");
        return t ? { Authorization: "Bearer " + t } : {};
      }

      async function load() {
        const mineDiv = document.getElementById("mine");
        mineDiv.innerHTML = "";

        // Get user info
        const meRes = await fetch(apiBase + "/auth/me", {
          headers: authHeaders(),
        });
        if (!meRes.ok) {
          mineDiv.innerHTML = "Failed to load profile.";
          return;
        }
        const me = await meRes.json();

        // Get feed posts
        const res = await fetch(apiBase + "/feed", { headers: authHeaders() });
        const posts = await res.json();

        posts.forEach((p) => {
          const isMine =
            (p.user_id && p.user_id === me.id) ||
            (p.user && p.user.email === me.email);

          if (!isMine) return;

          const div = document.createElement("div");
          div.className = "post";

          div.innerHTML = `
      ${p.url ? `<img src="${p.url}" class="post-image" alt="${p.title || "Product"}">` : `<div class="post-image"></div>`}
      <div class="post-body">
        <h3 class="post-title">${p.title || "Untitled"}</h3>
        <p class="post-description">${p.description || ""}</p>
        <div class="post-meta">
          <div><strong>Price:</strong> <span class="price">₹${p.price}</span></div>
          <div><strong>Location:</strong> ${p.location}</div>
          <div><strong>Status:</strong> <span class="status-badge status-${p.status.toLowerCase()}">${p.status}</span></div>
          <div><strong>Posted:</strong> ${p.created_at}</div>
        </div>
      </div>
      <div class="post-actions">
        <button id="edit-${p.id}" class="edit-btn">Edit</button>
        <button id="delete-${p.id}" class="delete-btn secondary">Delete</button>
      </div>
    `;

          // EDIT BUTTON
          const editBtn = div.querySelector(".edit-btn");
          editBtn.onclick = () =>
            (location.href = "/static/edit_post.html?id=" + (p.id || p.uuid));

          // DELETE BUTTON
          const delBtn = div.querySelector(".delete-btn");
          delBtn.onclick = async () => {
            if (!confirm("Delete this item?")) return;
            const r = await fetch(apiBase + "/post/" + (p.id || p.uuid), {
              method: "DELETE",
              headers: authHeaders(),
            });
            if (!r.ok) return alert("Delete failed");
            alert("Deleted successfully!");
            load();
          };

          mineDiv.appendChild(div);
        });
      }
      load();
    </script>
  </body>
</html>

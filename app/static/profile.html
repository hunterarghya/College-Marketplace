<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - College Marketplace</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header>
      <div class="header-logo">OLX CGEC</div>
      <nav class="header-nav">
        <button class="nav-btn" onclick="location.href = '/static/feed.html'">
          Back to Feed
        </button>
      </nav>
    </header>

    <div class="container">
      <h1>My Profile</h1>
      <div class="profile-info" id="info"></div>
    </div>

    <script>
      const apiBase = "";
      function authHeaders() {
        const t = localStorage.getItem("token");
        return t ? { Authorization: "Bearer " + t } : {};
      }

      async function load() {
        const res = await fetch(apiBase + "/auth/me", {
          headers: authHeaders(),
        });

        if (!res.ok) {
          document.getElementById("info").innerHTML =
            '<div class="empty-state"><p>Failed to load profile.</p></div>';
          return;
        }

        const me = await res.json();

        // Render nicely formatted profile info
        const html = `
          <div class="info-item"><span class="info-label">Name:</span> <span class="info-value">${me.name || "N/A"}</span></div>
          <div class="info-item"><span class="info-label">Email:</span> <span class="info-value">${me.email || "N/A"}</span></div>
          <div class="info-item"><span class="info-label">Phone:</span> <span class="info-value">${me.phone || "N/A"}</span></div>
          <div class="info-item"><span class="info-label">UPI ID:</span> <span class="info-value">${me.upi_id || "N/A"}</span></div>
        `;

        document.getElementById("info").innerHTML = html;
      }

      load();
    </script>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - College Marketplace</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header>
      <div class="header-logo">OLX CGEC</div>
    </header>
    <div class="container">
      <div class="auth-form">
        <h2>Login</h2>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="Enter your email" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            placeholder="Enter your password"
          />
        </div>
        <div id="msg" class="message"></div>
        <div class="button-group">
          <button id="loginBtn">Login</button>
          <button id="toRegister" class="secondary">Register</button>
        </div>
      </div>
    </div>

    <script>
      const apiBase = "";

      document.getElementById("toRegister").addEventListener("click", () => {
        location.href = "/static/register.html";
      });

      document
        .getElementById("loginBtn")
        .addEventListener("click", async () => {
          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;
          const res = await fetch(apiBase + "/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          if (!res.ok) {
            const j = await res
              .json()
              .catch(() => ({ detail: res.statusText }));
            document.getElementById("msg").innerText =
              "Login failed: " + (j.detail || res.statusText);
            return;
          }
          const data = await res.json();
          localStorage.setItem("token", data.access_token);
          // go to feed
          location.href = "/static/feed.html";
        });
    </script>
  </body>
</html>

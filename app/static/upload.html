<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sell Item - College Marketplace</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header>
      <div class="header-logo">OLX CGEC</div>
      <nav class="header-nav">
        <button class="nav-btn" onclick="location.href = '/static/feed.html'">
          Back to Feed
        </button>
      </nav>
    </header>

    <div class="container">
      <div class="upload-form">
        <h2>Sell an Item</h2>
        <form id="uploadForm">
          <div class="form-group">
            <label for="title">Title</label>
            <input
              id="title"
              name="title"
              type="text"
              placeholder="Product name"
              required
            />
          </div>
          <div class="form-group">
            <label for="description">Description</label>
            <input
              id="description"
              name="description"
              type="text"
              placeholder="Describe your product"
            />
          </div>
          <div class="form-group">
            <label for="price">Price (₹)</label>
            <input
              id="price"
              name="price"
              type="number"
              placeholder="Enter price"
              required
            />
          </div>
          <div class="form-group">
            <label for="location">Location</label>
            <input
              id="location"
              name="location"
              type="text"
              placeholder="Your city/area"
            />
          </div>
          <div class="form-group">
            <label for="file">Product Image</label>
            <input
              id="file"
              name="file"
              type="file"
              accept="image/*"
              required
            />
          </div>
          <div id="msg" class="message"></div>
          <button type="submit">Upload Item</button>
        </form>
      </div>
    </div>

    <script>
      const apiBase = "";
      function authHeaders() {
        const t = localStorage.getItem("token");
        return t ? { Authorization: "Bearer " + t } : {};
      }

      document
        .getElementById("uploadForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const form = e.target;
          const fd = new FormData(form);

          const res = await fetch(apiBase + "/upload", {
            method: "POST",
            headers: { ...authHeaders() },
            body: fd,
          });

          if (!res.ok) {
            const j = await res
              .json()
              .catch(() => ({ detail: res.statusText }));
            document.getElementById("msg").innerText =
              "Upload failed: " + (j.detail || res.statusText);
            return;
          }

          const post = await res.json();
          document.getElementById("msg").innerText = "Uploaded!";
        });
    </script>
  </body>
</html>
